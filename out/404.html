<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>404 | STOREX</title><link rel="icon" href="/storex-icon.svg"><script>try{document.documentElement.dataset.theme=localStorage.getItem('storex-theme')==='light'?'light':'dark'}catch{}</script><link rel="stylesheet" href="/fonts/brand.css"><style>*{box-sizing:border-box}body{margin:0;background:#090e16;color:#f1f4fa;font-family:'IBM Plex Sans',Arial,sans-serif}.container{width:min(1120px,calc(100% - 40px));margin:auto}header{padding:32px 0;border-bottom:1px solid #ffffff20}header img{width:145px;height:auto}.logo-light{display:none}[data-theme=light] body{background:#fff;color:#13263c}[data-theme=light] p{color:#526479}[data-theme=light] .error-number{color:#034288}[data-theme=light] header{border-color:#03428824}[data-theme=light] .logo-dark{display:none}[data-theme=light] .logo-light{display:block}main{padding:90px 0}.error-number{font-size:100px;color:#81a1c4;letter-spacing:-8px}h1{font-family:Play,'IBM Plex Sans',Arial,sans-serif;font-size:clamp(30px,5vw,50px);font-weight:400}p{max-width:600px;color:#9aa8bc;line-height:1.8}.button{display:inline-block;margin-top:25px;padding:17px 24px;background:#034288;color:white;text-decoration:none}a:focus-visible{outline:2px solid white;outline-offset:5px}</style></head><body><header><div class="container"><a href="/ru/" aria-label="Storex"><img class="logo-dark" src="/images/storex-logo-white.svg" alt="STOREX"><img class="logo-light" src="/images/storex-logo-blue.svg" alt="STOREX"></a></div></header><main class="container"><div class="error-number">404</div><h1>Страница не найдена</h1><p>Возможно, ссылка изменилась. Продолжим с главной страницы.</p><a class="button" href="/ru/">На главную ↗</a></main><script>const t={"ru":{"title":"Страница не найдена","text":"Возможно, ссылка изменилась. Продолжим с главной страницы.","back":"На главную"},"kk":{"title":"Бет
